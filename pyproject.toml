[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photosleuth"
version = "1.1.0"
description = "Ultimate Image Metadata & Location Analyzer"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "IamG2" }]
keywords = ["exif", "metadata", "osint", "gps", "geolocation", "privacy"]
dependencies = [
    "exifread>=3.0.0",
    "geopy>=2.2.0",
    "Pillow>=9.0.0",
    "requests>=2.25.0",
    "folium>=0.12.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/g33l0/photosleuth"
Issues = "https://github.com/g33l0/photosleuth/issues"

[project.scripts]
photosleuth = "photosleuth.cli:run"

[project.optional-dependencies]
dev = ["pytest>=7.0", "piexif>=1.1.3"]

[tool.setuptools.packages.find]
include = ["photosleuth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
