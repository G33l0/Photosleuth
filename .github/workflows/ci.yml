name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxrender1 libxi6

      - name: Install PhotoSleuth
        run: python -m pip install -e ".[dev]"

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Check the CLI runs
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          photosleuth --version
          photosleuth --show-config --no-banner

  build-windows:
    name: Build Windows application
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build,gui]"

      - name: Sync versions and regenerate icons
        run: |
          python tools/sync_version.py
          python tools/make_assets.py

      - name: Build with PyInstaller
        run: python -m PyInstaller packaging/photosleuth.spec --noconfirm --clean

      - name: Smoke-test the frozen build
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist\PhotoSleuth\photosleuth-cli.exe --cli --version

      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { & $iscc packaging\installer.iss }
          else { Write-Warning "Inno Setup not installed on this runner; skipping." }

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSleuth-windows
          path: |
            dist/PhotoSleuth/
            dist/installer/*.exe
          if-no-files-found: warn
